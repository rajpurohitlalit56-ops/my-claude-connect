<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Order Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#4F46E5;
    --indigo-dark:#3730A3;
    --emerald:#10B981;
    --bg:#EEF0FA;
    --bot-bubble:#FFFFFF;
    --user-bubble:#4F46E5;
    --text:#1E1B3A;
    --muted:#6B7280;
    --danger:#EF4444;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Sora',sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:column;
    height:100dvh;
    overflow:hidden;
  }

  /* Header */
  .chat-header{
    background:linear-gradient(135deg, var(--indigo) 0%, var(--indigo-dark) 100%);
    color:#fff;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 2px 10px rgba(79,70,229,0.25);
    z-index:5;
    flex-shrink:0;
  }
  .back-btn{
    width:34px;height:34px;
    border-radius:50%;
    background:rgba(255,255,255,0.15);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    cursor:pointer;
    border:none;
    color:#fff;
  }
  .back-btn svg{width:18px;height:18px;}
  .header-avatar{
    width:38px;height:38px;
    border-radius:12px;
    background:rgba(255,255,255,0.18);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
    flex-shrink:0;
  }
  .header-info{display:flex; flex-direction:column; min-width:0;}
  .header-info .name{font-weight:600; font-size:15px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .header-info .status{font-size:12px; opacity:0.85; display:flex; align-items:center; gap:5px;}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--emerald); display:inline-block;}

  /* Chat body */
  .chat-body{
    flex:1;
    overflow-y:auto;
    padding:18px 12px 10px;
    display:flex;
    flex-direction:column;
    gap:2px;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(79,70,229,0.05) 0%, transparent 40%),
      radial-gradient(circle at 90% 60%, rgba(16,185,129,0.05) 0%, transparent 40%);
  }
  .date-chip{
    align-self:center;
    background:rgba(255,255,255,0.8);
    color:var(--muted);
    font-size:11px;
    padding:4px 12px;
    border-radius:20px;
    margin:6px 0 14px;
    font-weight:500;
  }

  .msg-row{
    display:flex;
    margin-bottom:10px;
    max-width:100%;
    animation:rise 0.32s ease;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .msg-row.bot{justify-content:flex-start;}
  .msg-row.user{justify-content:flex-end;}

  .bubble{
    max-width:78%;
    padding:10px 13px;
    border-radius:var(--radius);
    font-size:14.5px;
    line-height:1.45;
    position:relative;
    box-shadow:0 1px 2px rgba(0,0,0,0.06);
  }
  .bot .bubble{
    background:var(--bot-bubble);
    color:var(--text);
    border-bottom-left-radius:4px;
  }
  .user .bubble{
    background:var(--user-bubble);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .bubble .time{
    display:block;
    font-size:10.5px;
    margin-top:4px;
    opacity:0.55;
    text-align:right;
  }
  .bubble.system{
    background:transparent;
    color:var(--muted);
    font-size:12.5px;
    text-align:center;
    box-shadow:none;
    padding:2px 8px;
  }

  .bubble img.qr{
    width:100%;
    max-width:210px;
    border-radius:10px;
    display:block;
    margin-bottom:8px;
    border:1px solid #E5E7EB;
  }
  .price-tag{
    display:inline-block;
    background:rgba(16,185,129,0.12);
    color:#047857;
    font-weight:700;
    font-size:13px;
    padding:3px 10px;
    border-radius:8px;
    margin-top:6px;
  }

  .qr-download{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#F3F4F8;
    color:var(--indigo-dark);
    font-family:'Sora',sans-serif;
    font-weight:600;
    font-size:12.5px;
    padding:7px 13px;
    border-radius:20px;
    border:1px solid #E0E1F5;
    text-decoration:none;
    margin-top:8px;
    margin-left:8px;
    cursor:pointer;
  }
  .qr-download:active{transform:scale(0.96);}
  .qr-download svg{width:14px;height:14px;flex-shrink:0;}
  .qr-row{display:flex; align-items:center; flex-wrap:wrap;}

  .join-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:var(--emerald);
    color:#fff;
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:14px;
    padding:11px 16px;
    border-radius:24px;
    text-decoration:none;
    margin-top:10px;
    border:none;
    cursor:pointer;
    width:100%;
  }
  .join-btn:active{transform:scale(0.98);}
  .join-btn svg{width:16px;height:16px;flex-shrink:0;}

  .copy-link-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:8px;
    background:#F3F4F8;
    border-radius:10px;
    padding:8px 10px;
  }
  .copy-link-row input{
    flex:1;
    border:none;
    background:transparent;
    font-size:11.5px;
    color:var(--muted);
    outline:none;
    min-width:0;
  }
  .copy-link-btn{
    flex-shrink:0;
    background:#fff;
    border:1px solid #E0E1F5;
    border-radius:8px;
    padding:6px 10px;
    font-family:'Sora',sans-serif;
    font-size:11px;
    font-weight:600;
    color:var(--indigo-dark);
    cursor:pointer;
  }
  .copy-link-btn:active{transform:scale(0.95);}
  .copy-link-btn.copied{color:#047857;}

  .buy-again-btn{
    display:inline-block;
    background:var(--indigo);
    color:#fff;
    font-family:'Sora',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:9px 18px;
    border-radius:22px;
    text-decoration:none;
    margin-top:8px;
    border:none;
    cursor:pointer;
  }
  .buy-again-btn:active{transform:scale(0.97);}

  .bubble img.screenshot{
    width:170px;
    border-radius:10px;
    display:block;
  }

  .status-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:600;
    padding:5px 11px;
    border-radius:20px;
    margin-top:6px;
  }
  .status-pill.pending{background:#FEF3C7; color:#92400E;}
  .status-pill.approved{background:#D1FAE5; color:#065F46;}
  .status-pill.rejected{background:#FEE2E2; color:#991B1B;}
  .status-pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

  .typing{
    display:flex;
    gap:4px;
    padding:12px 14px;
  }
  .typing span{
    width:7px;height:7px;border-radius:50%;
    background:#B7B4D6;
    animation:blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:0.15s;}
  .typing span:nth-child(3){animation-delay:0.3s;}
  @keyframes blink{
    0%,80%,100%{opacity:0.3; transform:scale(0.8);}
    40%{opacity:1; transform:scale(1);}
  }

  /* Input bar */
  .input-bar{
    flex-shrink:0;
    background:#fff;
    border-top:1px solid #E5E7EB;
    padding:10px 12px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
  }
  .input-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .attach-btn{
    width:42px;height:42px;
    border-radius:50%;
    border:none;
    background:var(--indigo);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .attach-btn:active{transform:scale(0.92);}
  .attach-btn svg{width:20px;height:20px;}
  .attach-btn:disabled{background:#C7C4E8; cursor:not-allowed;}

  .fake-input{
    flex:1;
    background:#F3F4F8;
    border-radius:22px;
    padding:11px 16px;
    font-size:13.5px;
    color:var(--muted);
  }

  .hint-text{
    font-size:11px;
    color:var(--muted);
    text-align:center;
    margin-top:6px;
  }

  #fileInput{display:none;}

  ::-webkit-scrollbar{width:0px;}
</style>
</head>
<body>

  <div class="chat-header">
    <button class="back-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="header-avatar" id="headerAvatar">📚</div>
    <div class="header-info">
      <div class="name" id="headerName">Loading...</div>
      <div class="status"><span class="status-dot"></span> Order Assistant • Online</div>
    </div>
  </div>

  <div class="chat-body" id="chatBody">
    <div class="date-chip">Today</div>
  </div>

  <div class="input-bar">
    <div class="input-row">
      <button class="attach-btn" id="attachBtn" title="Send payment screenshot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a5 5 0 01-7.07-7.07l9.19-9.19a3 3 0 014.24 4.24l-9.19 9.19a1 1 0 01-1.41-1.41l8.48-8.49"/></svg>
      </button>
      <div class="fake-input" id="fakeInputText">Screenshot bhejne ke liye 📎 dabayein</div>
    </div>
    <input type="file" id="fileInput" accept="image/*">
    <div class="hint-text">Sirf payment screenshot bheji jaye • JPG/PNG</div>
  </div>

<script>
/* ---------------------------------------------------------
   PRODUCT DATA — ab yeh naye "get-product" function se aata
   hai (jo netlify/functions/products.js file se padhta hai).
   Naya product add karna ho toh sirf products.js edit karo,
   is file mein kuch change nahi karna padega.
--------------------------------------------------------- */

const params = new URLSearchParams(window.location.search);
const productId = params.get("product") || "parmar4";
let product = null; // fetch hone ke baad set hoga

const chatBody = document.getElementById("chatBody");
const attachBtn = document.getElementById("attachBtn");
const fileInput = document.getElementById("fileInput");
const fakeInputText = document.getElementById("fakeInputText");

function nowTime(){
  return new Date().toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
}

function scrollDown(){
  chatBody.scrollTop = chatBody.scrollHeight;
}

function copyLink(btn, link){
  navigator.clipboard.writeText(link).then(()=>{
    const original = btn.textContent;
    btn.textContent = "Copied ✓";
    btn.classList.add('copied');
    setTimeout(()=>{
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 2000);
  }).catch(()=>{
    // fallback: select the text input for manual copy
  });
}

function approvedMessageHTML(inviteLink){
  if (!inviteLink) {
    return `🎉 Payment verified! Aapka access approve ho gaya hai.<br>Invite link jald milega, thodi der mein page reload karein.`;
  }
  const safeLink = inviteLink.replace(/'/g, "\\'");
  return `
    🎉 Payment verified! Aapka access approve ho gaya hai.
    <a class="join-btn" href="${inviteLink}" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 01-8.5 8.5 8.38 8.38 0 01-4.24-1.15L3 20l1.15-5.26A8.38 8.38 0 013 11.5 8.5 8.5 0 0111.5 3h.5A8.5 8.5 0 0121 11.5z"/></svg>
      Channel Join Karein
    </a>
    <div class="copy-link-row">
      <input type="text" readonly value="${inviteLink}" onclick="this.select()">
      <button class="copy-link-btn" onclick="copyLink(this, '${safeLink}')">Copy</button>
    </div>
  `;
}

function addBotBubble(html, opts={}){
  return new Promise(resolve=>{
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    const typing = document.createElement('div');
    typing.className = 'bubble';
    typing.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    row.appendChild(typing);
    chatBody.appendChild(row);
    scrollDown();

    setTimeout(()=>{
      typing.innerHTML = html + (opts.noTime ? '' : `<span class="time">${nowTime()}</span>`);
      scrollDown();
      resolve(row);
    }, opts.delay ?? 700);
  });
}

function addUserBubble(html){
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `<div class="bubble">${html}<span class="time">${nowTime()}</span></div>`;
  chatBody.appendChild(row);
  scrollDown();
  return row;
}

let orderStatusRow = null;
let pollTimer = null;

function qrMessageHTML(){
  return `
    <img class="qr" id="qrImg" src="${product.qr}" alt="Payment QR">
    Neeche diye QR ko scan karke payment complete karein.
    <div class="qr-row">
      <div class="price-tag">₹${product.price} only</div>
      <a class="qr-download" onclick="downloadQR('${product.qr}', '${product.name.replace(/\s+/g,'_')}_QR.png'); return false;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>
        Download QR
      </a>
    </div>
  `;
}

async function startConversation(){
  await addBotBubble(`Namaste! 👋 Aapne <b>${product.name}</b> select kiya hai.`, {delay:500});
  await addBotBubble(qrMessageHTML());
  await addBotBubble(`Payment ho jaane ke baad, screenshot yahin 📎 button se bhej dein — main aage ka process turant shuru kar dunga.`);
}

attachBtn.addEventListener('click', ()=>{
  fileInput.click();
});

fileInput.addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = async function(ev){
    addUserBubble(`<img class="screenshot" src="${ev.target.result}" alt="Payment screenshot">`);

    attachBtn.disabled = true;
    fakeInputText.textContent = "Screenshot bhej diya gaya ✅";

    await addBotBubble(`Screenshot mil gaya, dhanyavaad! 🙏`, {delay:600});
    orderStatusRow = await addBotBubble(`
      Aapka order review ke liye bhej diya gaya hai.
      <div class="status-pill pending"><span class="dot"></span> Pending Review</div>
    `, {delay:900});

    try {
      const response = await fetch('/.netlify/functions/submit-order', {
        method: 'POST',
        body: JSON.stringify({
          productId,
          productName: product.name,
          price: product.price,
          imageBase64: ev.target.result
        })
      });

      let result;
      const rawText = await response.text();
      try {
        result = JSON.parse(rawText);
      } catch(parseErr) {
        await addBotBubble(`⚠️ DEBUG: Server ne JSON nahi bheja.<br>Status: ${response.status}<br>Response: ${rawText.substring(0,300)}`);
        return;
      }

      if (result.success) {
        localStorage.setItem('lastOrderId', result.orderId);
        localStorage.setItem('lastProduct', productId);
        startPolling(result.orderId);
      } else {
        await addBotBubble(`⚠️ DEBUG: Function ne error diya.<br>Status: ${response.status}<br>Error: ${result.error || JSON.stringify(result)}`);
      }
    } catch (err) {
      await addBotBubble(`⚠️ DEBUG: Fetch hi fail hua.<br>Error: ${err.message}`);
    }
  };
  reader.readAsDataURL(file);
});

async function downloadQR(url, filename){
  try{
    const res = await fetch(url);
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(blobUrl);
  }catch(err){
    // fallback: open in new tab if fetch/blob fails (e.g. CORS-blocked host)
    window.open(url, '_blank');
  }
}

function startPolling(orderId){
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    try {
      const res = await fetch(`/.netlify/functions/check-status?orderId=${orderId}`);
      if (!res.ok) return;
      const order = await res.json();

      if (order.status === 'approved') {
        clearInterval(pollTimer);
        if (orderStatusRow) {
          const pill = orderStatusRow.querySelector('.status-pill');
          if (pill) { pill.className = 'status-pill approved'; pill.innerHTML = '<span class="dot"></span> Approved'; }
        }
        await addBotBubble(approvedMessageHTML(order.inviteLink));
        await addBotBubble(`Dobara yeh batch lena hai (jaise kisi aur ke liye)? <button class="buy-again-btn" onclick="startFreshOrder()">🔄 Dobara Order Karein</button>`, {noTime:true, delay:400});
        attachBtn.disabled = true;
        fakeInputText.textContent = "Order approved ho chuka hai ✅";
      } else if (order.status === 'rejected') {
        clearInterval(pollTimer);
        if (orderStatusRow) {
          const pill = orderStatusRow.querySelector('.status-pill');
          if (pill) { pill.className = 'status-pill rejected'; pill.innerHTML = '<span class="dot"></span> Rejected'; }
        }
        await addBotBubble(`❌ Aapka screenshot verify nahi ho paya. Kripya sahi payment screenshot dobara bhejein.`);
        await addBotBubble(`<button class="buy-again-btn" onclick="startFreshOrder()">🔄 Dobara Try Karein</button>`, {noTime:true, delay:400});
        localStorage.removeItem('lastOrderId');
        localStorage.removeItem('lastProduct');
        attachBtn.disabled = false;
        fakeInputText.textContent = "Screenshot bhejne ke liye 📎 dabayein";
      }
      // agar "pending" hai, kuch nahi karna — agli baar phir check karega
    } catch (err) {
      // silent fail, agli baar phir try karega
    }
  }, 8000);
}

async function resumeIfExists(){
  const savedOrderId = localStorage.getItem('lastOrderId');
  const savedProduct = localStorage.getItem('lastProduct');

  if (savedOrderId && savedProduct === productId) {
    await addBotBubble(`Aapka pehle se ek order hai <b>${product.name}</b> ke liye. Status check kar raha hoon...`, {delay:300});

    try {
      const res = await fetch(`/.netlify/functions/check-status?orderId=${savedOrderId}`);
      if (!res.ok) throw new Error('not found');
      const order = await res.json();

      if (order.status === 'pending') {
        orderStatusRow = await addBotBubble(`
          Aapka order abhi bhi review mein hai.
          <div class="status-pill pending"><span class="dot"></span> Pending Review</div>
        `);
        attachBtn.disabled = true;
        fakeInputText.textContent = "Screenshot bhej diya gaya ✅";
        startPolling(savedOrderId);
      } else if (order.status === 'approved') {
        await addBotBubble(approvedMessageHTML(order.inviteLink));
        await addBotBubble(`Dobara yeh batch lena hai (jaise kisi aur ke liye)? <button class="buy-again-btn" onclick="startFreshOrder()">🔄 Dobara Order Karein</button>`, {noTime:true, delay:400});
        attachBtn.disabled = true;
        fakeInputText.textContent = "Order approved ho chuka hai ✅";
      } else if (order.status === 'rejected') {
        await addBotBubble(`❌ Aapka pichla screenshot verify nahi ho paya. Kripya sahi payment screenshot dobara bhejein.`);
        await addBotBubble(`<button class="buy-again-btn" onclick="startFreshOrder()">🔄 Dobara Try Karein</button>`, {noTime:true, delay:400});
        localStorage.removeItem('lastOrderId');
        localStorage.removeItem('lastProduct');
      }
    } catch (err) {
      localStorage.removeItem('lastOrderId');
      localStorage.removeItem('lastProduct');
      startConversation();
    }
  } else {
    startConversation();
  }
}

function startFreshOrder(){
  localStorage.removeItem('lastOrderId');
  localStorage.removeItem('lastProduct');
  attachBtn.disabled = false;
  fakeInputText.textContent = "Screenshot bhejne ke liye 📎 dabayein";
  addBotBubble(`Bilkul! Naya order shuru karte hain <b>${product.name}</b> ke liye.`, {delay:300}).then(()=>{
    addBotBubble(qrMessageHTML());
  });
}

async function init(){
  try {
    const res = await fetch(`/.netlify/functions/get-product?id=${productId}`);
    if (!res.ok) throw new Error('Product not found');
    product = await res.json();

    document.getElementById("headerName").textContent = product.name;
    document.getElementById("headerAvatar").textContent = product.icon;

    resumeIfExists();
  } catch (err) {
    document.getElementById("headerName").textContent = "Product not found";
    await addBotBubble(`⚠️ Yeh product nahi mila. Sahi link se try karein, ya support se sampark karein.`);
  }
}

init();
</script>

</body>
</html>
